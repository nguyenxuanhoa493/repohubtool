name = "retrohub-lobby"
main = "worker.js"
compatibility_date = "2024-09-01"

# KV Namespace Binding
# Chạy lệnh sau để tạo KV:
#   npx wrangler kv:namespace create LOBBY_KV
# Rồi dán id vào bên dưới:
[[kv_namespaces]]
binding = "LOBBY_KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"

# Biến môi trường tuỳ chọn (nếu muốn tự động post lên Telegram Channel)
# [vars]
# TELEGRAM_BOT_TOKEN = "your_bot_token"
# TELEGRAM_CHANNEL_ID = "@retrohub_netplay"
